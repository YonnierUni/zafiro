name: Build and publish Docs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Enable SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Copy dist to docs
        run: |
          mkdir -p docs
          find docs -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          cp -R dist/. docs/
          cp dist/index.html docs/404.html

      - name: Commit published docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
          else
            git commit -m "Update published site"
            git push origin main
          fi
